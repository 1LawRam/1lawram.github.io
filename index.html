<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Temporarily Unavailable Due to Legal Process — Lawrence Lei-Ramirez</title>
<meta name="description" content="This site is temporarily unavailable due to legal process. Estimated time of return: mid 2027.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://lawrenceleiramirez.com/">

<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="icon" href="images/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="images/apple-touch-icon.png">
<meta name="theme-color" content="#f4eee2">

<style>
@font-face{font-family:"Inter var";src:url("fonts/inter.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Bricolage var";src:url("fonts/bricolage.woff2") format("woff2");font-weight:200 800;font-stretch:75% 100%;font-display:swap}

:root{
  color-scheme:light;
  --paper:#f4eee2; --card:#fffaf0;
  --ink:#16120e; --rule:#cbbfa9;
  --amber:#f2b134; --brick-2:#a8381a;
  --steel:#b9b2a4; --cocoa:#5c3b37;
  --tape-h:28px;
  --sans:"Inter var",-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  --display:"Bricolage var","Inter var",Impact,sans-serif;
  --mono:"SF Mono",ui-monospace,"IBM Plex Mono",Menlo,Consolas,monospace;
  --sky:
    linear-gradient(var(--rule) 1px,transparent 1px),
    linear-gradient(90deg,var(--rule) 1px,transparent 1px),
    linear-gradient(var(--paper),var(--paper));
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* the wall fills everything between the two tapes */
.wall{
  position:fixed;
  top:var(--tape-h); bottom:var(--tape-h); left:0; right:0;
  z-index:0;
  background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='352'%20height='168'%3E%3Crect%20width='352'%20height='168'%20fill='%23c4b7a0'/%3E%3Crect%20x='0'%20y='0'%20width='83'%20height='37'%20rx='2'%20fill='%23e4572e'/%3E%3Crect%20x='88'%20y='0'%20width='83'%20height='37'%20rx='2'%20fill='%23d8502a'/%3E%3Crect%20x='176'%20y='0'%20width='83'%20height='37'%20rx='2'%20fill='%23cc4824'/%3E%3Crect%20x='264'%20y='0'%20width='83'%20height='37'%20rx='2'%20fill='%23e9603a'/%3E%3Crect%20x='-44'%20y='42'%20width='83'%20height='37'%20rx='2'%20fill='%23e9603a'/%3E%3Crect%20x='44'%20y='42'%20width='83'%20height='37'%20rx='2'%20fill='%23e4572e'/%3E%3Crect%20x='132'%20y='42'%20width='83'%20height='37'%20rx='2'%20fill='%23d8502a'/%3E%3Crect%20x='220'%20y='42'%20width='83'%20height='37'%20rx='2'%20fill='%23cc4824'/%3E%3Crect%20x='308'%20y='42'%20width='83'%20height='37'%20rx='2'%20fill='%23e9603a'/%3E%3Crect%20x='0'%20y='84'%20width='83'%20height='37'%20rx='2'%20fill='%23cc4824'/%3E%3Crect%20x='88'%20y='84'%20width='83'%20height='37'%20rx='2'%20fill='%23e9603a'/%3E%3Crect%20x='176'%20y='84'%20width='83'%20height='37'%20rx='2'%20fill='%23e4572e'/%3E%3Crect%20x='264'%20y='84'%20width='83'%20height='37'%20rx='2'%20fill='%23d8502a'/%3E%3Crect%20x='-44'%20y='126'%20width='83'%20height='37'%20rx='2'%20fill='%23d8502a'/%3E%3Crect%20x='44'%20y='126'%20width='83'%20height='37'%20rx='2'%20fill='%23cc4824'/%3E%3Crect%20x='132'%20y='126'%20width='83'%20height='37'%20rx='2'%20fill='%23e9603a'/%3E%3Crect%20x='220'%20y='126'%20width='83'%20height='37'%20rx='2'%20fill='%23e4572e'/%3E%3Crect%20x='308'%20y='126'%20width='83'%20height='37'%20rx='2'%20fill='%23d8502a'/%3E%3C/svg%3E");
  background-repeat:repeat;
  background-position:right top;
}

/* the knocked-out top-right corner */
.notch{
  position:absolute; top:0; right:0;
  width:352px; height:210px;
  background:var(--sky);
  background-size:38px 38px,38px 38px,auto;
  background-position:right top,right top,0 0;
  -webkit-clip-path:polygon(0 0,352px 0,352px 210px,264px 210px,264px 168px,176px 168px,176px 126px,88px 126px,88px 42px,0 42px);
  clip-path:polygon(0 0,352px 0,352px 210px,264px 210px,264px 168px,176px 168px,176px 126px,88px 126px,88px 42px,0 42px);
  filter:drop-shadow(-3px 3px 0 rgba(22,18,14,.5));
}

.tape{
  position:fixed; left:0; right:0; height:var(--tape-h); z-index:5;
  background-image:repeating-linear-gradient(-45deg,var(--amber) 0 18px,#16120e 18px 36px);
  background-size:50.9px 50.9px;
  border-block:2px solid #16120e;
  animation:slide 2.6s linear infinite;
}
.tape-top{top:0}
.tape-bottom{bottom:0;animation-direction:reverse}
@keyframes slide{to{background-position:50.9px 0}}

/* the notice, taped to the wall */
.paper{
  position:fixed; left:50%; top:45%;
  transform:translate(-50%,-50%) rotate(-1.2deg);
  z-index:3;
  width:min(470px,66vw);
  background:var(--card);
  padding:clamp(20px,3.4vw,34px) clamp(18px,3vw,30px) clamp(16px,2.6vw,26px);
  text-align:center;
  box-shadow:6px 8px 0 rgba(22,18,14,.32);
}
.paper::after{content:"";position:absolute;inset:0;border:1px solid rgba(0,0,0,.13);pointer-events:none}

h1{font-family:var(--display);font-weight:800;font-size:clamp(17px,3.5vw,29px);line-height:1.06;letter-spacing:-.022em}
.etr{
  margin-top:clamp(10px,1.7vw,16px);
  padding-top:clamp(10px,1.7vw,16px);
  border-top:1.5px dashed rgba(0,0,0,.26);
  font-family:var(--mono);font-weight:600;
  font-size:clamp(10px,1.65vw,15px);
  letter-spacing:.07em;text-transform:uppercase;
  color:var(--brick-2);
}
.sig{display:block;width:44%;margin:clamp(10px,1.7vw,16px) auto 0;opacity:.9}

.t{position:absolute;width:26%;height:0;padding-bottom:8.5%;
    background:rgba(242,177,52,.6);border:1px solid rgba(0,0,0,.16)}
.t.tl{top:-4%;left:-8%;transform:rotate(-34deg)}
.t.tr{top:-4%;right:-8%;transform:rotate(34deg)}
.t.bl{bottom:-4%;left:-8%;transform:rotate(34deg)}
.t.br{bottom:-4%;right:-8%;transform:rotate(-34deg)}

.floor{position:fixed;left:0;right:0;bottom:var(--tape-h);z-index:2;
        height:clamp(158px,21vw,270px);pointer-events:none}
.floor svg{display:block;width:100%;height:100%}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@media (max-width:620px){
  .notch{
    width:176px;height:126px;
    -webkit-clip-path:polygon(0 0,176px 0,176px 126px,88px 126px,88px 84px,0 84px);
    clip-path:polygon(0 0,176px 0,176px 126px,88px 126px,88px 84px,0 84px);
  }
  .paper{width:80vw;top:42%}
}
</style>
</head>
<body>

<div class="wall" aria-hidden="true"><div class="notch"></div></div>
<div class="tape tape-top" aria-hidden="true"></div>

<div class="paper">
  <span class="t tl"></span><span class="t tr"></span>
  <span class="t bl"></span><span class="t br"></span>
  <h1>Temporarily Unavailable<br>Due to Legal Process</h1>
  <p class="etr">ETR: Mid 2027</p>
  <img class="sig" src="images/signature.svg" alt="Lawrence Lei-Ramirez, signed">
</div>

<div class="floor" aria-hidden="true">
  <svg viewBox="0 0 1400 270" preserveAspectRatio="xMinYMax slice" fill="none"
       stroke-linecap="round" stroke-linejoin="round">

    <!-- ground -->
    <rect x="0" y="214" width="1400" height="56" fill="var(--paper)"/>
    <g stroke="var(--rule)" stroke-width="2" opacity=".8"><path d="M-30 270 L14 214 M22 270 L66 214 M74 270 L118 214 M126 270 L170 214 M178 270 L222 214 M230 270 L274 214 M282 270 L326 214 M334 270 L378 214 M386 270 L430 214 M438 270 L482 214 M490 270 L534 214 M542 270 L586 214 M594 270 L638 214 M646 270 L690 214 M698 270 L742 214 M750 270 L794 214 M802 270 L846 214 M854 270 L898 214 M906 270 L950 214 M958 270 L1002 214 M1010 270 L1054 214 M1062 270 L1106 214 M1114 270 L1158 214 M1166 270 L1210 214 M1218 270 L1262 214 M1270 270 L1314 214 M1322 270 L1366 214 M1374 270 L1418 214"/></g>
    <path d="M0 214 H1400" stroke="var(--ink)" stroke-width="3.5"/>

    <!-- cement mixer -->
    <g>
      <!-- rear wheel, tangent to the ground -->
      <circle cx="256" cy="186" r="28" fill="var(--steel)" stroke="var(--ink)" stroke-width="4"/>
      <g stroke="var(--ink)" stroke-width="2.6" opacity=".45">
        <path d="M256 160 V212 M230 186 H282 M238 168 L274 204 M274 168 L238 204"/>
      </g>
      <circle cx="256" cy="186" r="9" fill="var(--paper)" stroke="var(--ink)" stroke-width="3"/>

      <!-- frame: strut to the wheel, leg to the foot -->
      <path d="M192 172 L256 186" stroke="var(--ink)" stroke-width="8"/>
      <path d="M192 172 L150 208" stroke="var(--ink)" stroke-width="8"/>
      <rect x="124" y="205" width="52" height="14" rx="7" fill="var(--cocoa)" stroke="var(--ink)" stroke-width="3.2"/>
      <path d="M176 190 L232 180" stroke="var(--ink)" stroke-width="5" opacity=".75"/>

      <!-- drum -->
      <g transform="rotate(-20 196 112)">
        <ellipse cx="196" cy="112" rx="70" ry="56" fill="var(--steel)" stroke="var(--ink)" stroke-width="4"/>
        <path d="M196 56 a70 56 0 0 1 0 112" fill="rgba(22,18,14,.1)"/>
        <path d="M136 132 q60 22 120 0" stroke="var(--ink)" stroke-width="2.6" opacity=".4"/>
        <path d="M143 150 q53 17 106 0" stroke="var(--ink)" stroke-width="2.6" opacity=".4"/>
        <ellipse cx="196" cy="58" rx="44" ry="17" fill="var(--steel)" stroke="var(--ink)" stroke-width="3.6"/>
        <ellipse cx="196" cy="58" rx="31" ry="11" fill="#4a3b30" stroke="var(--ink)" stroke-width="2.4"/>
      </g>

      <!-- tilt lever: trunnion, arm, grip -->
      <circle cx="140" cy="140" r="11" fill="var(--steel)" stroke="var(--ink)" stroke-width="3.6"/>
      <circle cx="140" cy="140" r="3.4" fill="var(--ink)"/>
      <path d="M140 140 L100 174" stroke="var(--ink)" stroke-width="9"/>
      <path d="M100 174 L78 192" stroke="var(--ink)" stroke-width="18" stroke-linecap="round"/>
      <path d="M100 174 L78 192" stroke="var(--cocoa)" stroke-width="11" stroke-linecap="round"/>
    </g>

    <!-- mortar pile with the trowel standing in it -->
    <g>
      <path d="M382 214 q54 -34 108 0 Z" fill="var(--rule)" stroke="var(--ink)" stroke-width="3.2"/>
      <g transform="rotate(17 436 206)">
        <path d="M436 206 L410 150 L424 124 L448 124 L462 150 Z"
              fill="var(--steel)" stroke="var(--ink)" stroke-width="3.6"/>
        <path d="M436 198 L436 128" stroke="var(--ink)" stroke-width="2.4" opacity=".4"/>
        <path d="M436 124 v-14" stroke="var(--ink)" stroke-width="4.4"/>
        <rect x="427" y="96" width="18" height="14" rx="4" fill="var(--steel)" stroke="var(--ink)" stroke-width="3"/>
        <rect x="423" y="58" width="26" height="40" rx="12" fill="var(--cocoa)" stroke="var(--ink)" stroke-width="3.4"/>
      </g>
    </g>

    <!-- bucket -->
    <g>
      <path d="M548 158 a26 15 0 0 1 52 0" stroke="var(--ink)" stroke-width="3.2"/>
      <path d="M542 160 L551 214 H597 L606 160 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="3.6"/>
      <path d="M542 160 H606" stroke="var(--ink)" stroke-width="3.6"/>
    </g>

    <!-- loose bricks lying on the ground, where the pale floor shows them off -->
    <g stroke="var(--ink)" stroke-width="3">
      <rect x="1120" y="222" width="92" height="26" rx="3" fill="#cc4824"/>
      <rect x="1224" y="222" width="92" height="26" rx="3" fill="#e4572e"/>
      <rect x="1172" y="190" width="92" height="26" rx="3" fill="#d8502a"/>
    </g>

  </svg>
</div>

<div class="tape tape-bottom" aria-hidden="true"></div>

</body>
</html>

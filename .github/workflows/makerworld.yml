name: Refresh MakerWorld stats

on:
  schedule:
    - cron: '17 6 * * *'   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: makerworld-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch current stats
        run: python3 scripts/fetch-makerworld.py

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- data/makerworld.json; then
            echo "No change."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/makerworld.json
          git commit -m "Refresh MakerWorld stats"
          git push
